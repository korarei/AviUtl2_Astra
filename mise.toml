[settings]
lockfile = true

[tools]
rust = { version = "1.99", profile = "minimal", components = [
    "clippy",
    "rustfmt",
    "rust-analyzer",
    "rust-src",
] }

[tasks.build]
raw_args = true
run = "cargo build --locked"

[tasks.check]
usage = 'flag "-h --help" help="Print help"'
tools."cargo:cargo-deny" = "0.20"
run = ["cargo clippy --locked", "cargo deny --locked check"]

[tasks.fmt]
raw_args = true
run = "cargo fmt"

[tasks.licenses]
usage = 'flag "-h --help" help="Print help"'
tools."cargo:cargo-about" = { version = "0.9", features = "cli" }
run = "cargo about generate --locked about.hbs -o THIRD_PARTY_LICENSES.md"

[tasks.outdated]
usage = 'flag "-h --help" help="Print help"'
tools."cargo:cargo-outdated" = "0.19"
run = "cargo outdated"

[tasks.test]
raw_args = true
run = "cargo test --locked"

[tasks.update]
usage = 'flag "-h --help" help="Print help"'
run = "cargo update"
