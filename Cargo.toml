[package]
name = "astra"
version = "0.10.0"
authors = ["Korarei"]
description = "Build tool and task runner for AviUtl ExEdit extensions"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "astra"
path = "src/main.rs"

[dependencies]
anyhow = "~1.0.0"
cel-interpreter = "~0.10.0"
chardetng = "~1.0.0"
clap = { version = "~4.6.0", features = ["derive"] }
clean-path = "~0.2.0"
dotenvy = "~0.15.0"
encoding_rs = "~0.8.0"
fd-lock = "~4.0.0"
wax = "~0.7.0"
indexmap = { version = "~2.14.0", features = ["serde"] }
regex = "~1.13.0"
reqwest = { version = "~0.13.0", default-features = false, features = [
    "blocking",
    "native-tls",
] }
semver = "~1.0.0"
schemars = "~1.2.0"
serde = { version = "~1.0.0", features = ["derive"] }
serde_json = "~1.0.0"
serde_with = { version = "~3.24.0", features = ["indexmap_2", "schemars_1"] }
tempfile = "~3.27.0"
toml_edit = "~0.25.0"
textwrap = "~0.16.0"
toml = { version = "~1.2.0", features = ["preserve_order"] }
tracing = "~0.1.0"
tracing-subscriber = { version = "~0.3.0", features = ["env-filter"] }
validator = { version = "~0.21.0", features = ["derive"] }
which = "~8.0.0"
xxhash-rust = { version = "~0.8.0", features = ["xxh3"] }
zip = { version = "~9.4.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
