[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = ["RUSTSEC-2024-0436"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
required-git-spec = "rev"
allow-git = []

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
include-dev = false
include-build = true
private = { ignore = true }
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "CC0-1.0",
    "bzip2-1.0.6",
    "NCSA",
]
